plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"cmdalias" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.0'
}

test {
	useJUnitPlatform()
}

tasks.register('fabricRegressionTest', JavaExec) {
	group = 'verification'
	description = 'Checks alias registration using the actual Fabric mixin transformer.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotServer'
	systemProperty 'fabric.development', 'true'
	workingDir = layout.buildDirectory.dir('fabric-regression').get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}

check.dependsOn fabricRegressionTest

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
